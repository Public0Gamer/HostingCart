{% extends "base.html" %}

{% block title %}Set New Password | {{ brand_name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="p-8 rounded-3xl bg-white border border-slate-200 shadow-md">
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 mx-auto flex items-center justify-center mb-3">
                <i data-lucide="shield-check" class="w-6 h-6"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900">Set New Password</h2>
            <p class="text-xs text-slate-500 mt-2">Enter your new secure password below.</p>
        </div>

        <form method="POST" action="/reset-password/{{ token }}" class="space-y-4 text-xs">
            <div>
                <label class="block font-bold text-slate-700 mb-1">New Password</label>
                <input type="password" name="password" minlength="8" placeholder="••••••••••••" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:border-primary-600 focus:bg-white" required>
            </div>
            <div>
                <label class="block font-bold text-slate-700 mb-1">Confirm New Password</label>
                <input type="password" name="confirm_password" minlength="8" placeholder="••••••••••••" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:border-primary-600 focus:bg-white" required>
            </div>
            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-xl shadow-sm transition text-sm">
                Update Password &amp; Log In
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Forgot Password | {{ brand_name }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="p-8 rounded-3xl bg-white border border-slate-200 shadow-md">
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 mx-auto flex items-center justify-center mb-3">
                <i data-lucide="key-round" class="w-6 h-6"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900">Forgot Password</h2>
            <p class="text-xs text-slate-500 mt-2">Enter your email address and we'll send you a secure link to reset your password.</p>
        </div>

        <form method="POST" action="/forgot-password" class="space-y-5 text-xs">
            <div>
                <label class="block font-bold text-slate-700 mb-1">Email Address</label>
                <input type="email" name="email" placeholder="you@example.com" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:border-primary-600 focus:bg-white" required>
            </div>
            <button type="submit" class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white font-extrabold rounded-xl shadow-sm transition text-sm">
                Send Reset Link
            </button>
        </form>

        <p class="text-xs text-center text-slate-500 mt-6">
            Remember your password? <a href="/login" class="text-primary-600 font-bold hover:underline">Log In here</a>
        </p>
    </div>
</div>
{% endblock %}
